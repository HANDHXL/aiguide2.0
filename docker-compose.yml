# ============================================================
# AI 数字人导游系统 — Docker Compose
# 启动: docker-compose up -d
# 访问: http://localhost
# ============================================================

version: "3.8"

services:
  backend:
    build: .
    container_name: tour-backend
    ports:
      - "8001:8001"
    volumes:
      # Persist vector DB and knowledge base
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      # Mount .env for API keys
      - ./.env:/app/.env:ro
    environment:
      - HF_HUB_OFFLINE=1
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: tour-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
